# content/research 全体の表記辞書（textlint-rule-prh）。
# expected が正しい表記、pattern が揺れ。specs は辞書自体のテストで、textlint 実行時に検証される。
# 検査対象: 本文・見出し・表・引用・リンク文字列・強調。インラインコードとコードブロックは対象外。
# 新しい用語の表記を決めたらここに追記する。特定分野だけの用語は分野別の辞書（prh-email.yml など）へ。
version: 1
rules:
  # 長音: 語尾の長音は付けない
  - expected: ユーザ
    pattern: ユーザー
  - expected: サーバ
    pattern: サーバー
  - expected: ヘッダ
    pattern: ヘッダー
  - expected: パーサ
    pattern: パーサー
  - expected: ブラウザ
    pattern: ブラウザー
  - expected: バッファ
    pattern: バッファー
  - expected: ロードバランサ
    pattern: ロードバランサー
  - expected: スケジューラ
    pattern: スケジューラー
  - expected: エンコーダ
    pattern: エンコーダー
  - expected: デコーダ
    pattern: デコーダー
  - expected: トレーラ
    pattern: トレーラー
  - expected: タイマ
    pattern: タイマー
  - expected: レンダラ
    pattern: レンダラー
  - expected: コンポジタ
    pattern: コンポジター
  - expected: ワーカ
    pattern: ワーカー
  # 語中の長音は省かない
  - expected: オーバーヘッド
    pattern: オーバヘッド
